[project]
name = "immich-addons"
version = "0.1.0"
description = "Self-hosted addon store (hub) for Immich, plus first-party addons."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Harry Malmgren" }]

dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
immich-addons-hub = "immich_addons.hub.app:main"

# Addons are discovered through this entry-point group (see CLAUDE.md). A third-party package can
# add to this group without this repo knowing about it; registry/index.json is the catalog.
[project.entry-points."immich_addons.addons"]
auto-lut = "immich_addons.addons.auto_lut:AutoLut"
trip-best-picks = "immich_addons.addons.trip_best_picks:TripBestPicks"
zine-maker = "immich_addons.addons.zine_maker:ZineMaker"
year-highlights = "immich_addons.addons.year_highlights:YearHighlights"

[dependency-groups]
dev = [
    "pillow>=10.3",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_addons"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
