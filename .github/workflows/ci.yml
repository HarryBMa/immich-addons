name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Acceptance tests that shell out to real tools skip when the tool is missing, and a
      # silently skipped acceptance test is worse than not having one. So CI installs all of them:
      # ffmpeg + exiftool for auto-lut, Pango/Cairo for WeasyPrint's PDF output. This also makes CI
      # the only place the zine PDFs are actually rendered — WeasyPrint cannot run on the Windows
      # development machine.
      - name: Install ffmpeg, exiftool and the WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libimage-exiftool-perl \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi8 \
            fonts-dejavu-core poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
